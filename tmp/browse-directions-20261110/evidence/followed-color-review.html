<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --amber-ink: #7a4e10;
      --amber-paper: #fff8ec;
      --amber-edge: #ead9bc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .review {
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 0 24px;
      font-family: var(--font-sans);
      color: var(--foreground);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted-foreground);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .lede {
      max-width: 610px;
      margin: 10px 0 22px;
      color: var(--muted-foreground);
      font-size: 14px;
      line-height: 1.75;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .option {
      margin: 0;
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .option.selected {
      border-color: var(--amber-edge);
      box-shadow: inset 0 0 0 1px var(--amber-edge);
    }
    .option img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: calc(var(--radius) - 4px);
    }
    .option figcaption {
      padding: 12px 2px 2px;
    }
    .option-head {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 24px;
    }
    .swatch {
      width: 12px;
      height: 12px;
      flex: none;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--border);
    }
    .option strong {
      font-size: 14px;
      font-weight: 600;
    }
    .tag {
      margin-left: auto;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--muted-foreground);
      font-size: 10px;
      line-height: 16px;
    }
    .selected .tag {
      background: var(--amber-paper);
      color: var(--amber-ink);
      box-shadow: inset 0 0 0 1px var(--amber-edge);
    }
    .option p {
      margin: 7px 0 0;
      color: var(--muted-foreground);
      font-size: 12px;
      line-height: 1.65;
    }
    .value {
      display: block;
      margin-top: 8px;
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .applied {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 14px;
      background: var(--secondary);
      border-radius: var(--radius);
      color: var(--muted-foreground);
      font-size: 12px;
      line-height: 1.6;
    }
    .live {
      flex: none;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--amber-paper);
      color: var(--amber-ink);
      box-shadow: inset 0 0 0 1px var(--amber-edge);
      font-weight: 600;
    }
    @media (max-width: 540px) {
      .options { grid-template-columns: 1fr; }
      .option { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; }
      .option figcaption { padding: 2px 0; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="review">
    <p class="eyebrow">状态色 · 已追番</p>
    <h1>从“操作成功”改成“已经收藏”</h1>
    <p class="lede">绿色更像系统回执，存在感也容易压过海报。暖琥珀更像片单里的书签，安静，但一眼能认出来。</p>

    <div class="options">
      <figure class="option selected">
        <img src="C:/Users/nathan/Documents/CodeProject/Dipper/tmp/browse-directions-20261110/evidence/followed-color-amber.png" alt="暖琥珀色已追番徽标">
        <figcaption>
          <div class="option-head">
            <span class="swatch" style="--swatch:#7a4e10"></span>
            <strong>暖琥珀</strong>
            <span class="tag">推荐</span>
          </div>
          <p>暖色表达“收藏”，和中性界面区分明确，又不抢海报。</p>
          <code class="value">#7A4E10 · 6.8:1</code>
        </figcaption>
      </figure>

      <figure class="option">
        <img src="C:/Users/nathan/Documents/CodeProject/Dipper/tmp/browse-directions-20261110/evidence/followed-color-paper.png" alt="暖纸色已追番徽标">
        <figcaption>
          <div class="option-head">
            <span class="swatch" style="--swatch:#4a4238"></span>
            <strong>暖纸</strong>
          </div>
          <p>最克制，但状态感偏弱，和普通标签的距离不够。</p>
          <code class="value">#4A4238</code>
        </figcaption>
      </figure>

      <figure class="option">
        <img src="C:/Users/nathan/Documents/CodeProject/Dipper/tmp/browse-directions-20261110/evidence/followed-color-ink.png" alt="墨黑色已追番徽标">
        <figcaption>
          <div class="option-head">
            <span class="swatch" style="--swatch:#242424"></span>
            <strong>墨黑</strong>
          </div>
          <p>足够清楚，但更像操作入口，而不像一个完成状态。</p>
          <code class="value">#FFFFFF / #242424</code>
        </figcaption>
      </figure>
    </div>

    <div class="applied">
      <span class="live">已应用</span>
      <span>首页海报徽标和详情元信息共用同一个状态色；形状、字号和间距保持不变。</span>
    </div>
  </main>
</body>
</html>
