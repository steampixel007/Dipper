name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Validate version tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          pattern="^v${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$"
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo 'Expected a version tag such as v1.2.3 or v1.2.3-rc.1' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${version%%+*}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: version
    uses: ./.github/workflows/check.yml

  build:
    needs: [version, checks]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: auto
      TARGET_OS: ${{ matrix.goos }}
      TARGET_ARCH: ${{ matrix.goarch }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version $env:VERSION -Platform "$env:TARGET_OS/$env:TARGET_ARCH"
      - name: Verify Windows installer
        if: matrix.goos == 'windows'
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1 -Version $env:VERSION
      - name: Verify Linux packages
        if: matrix.goos == 'linux'
        run: |
          stem="dist/dipper_${VERSION}_linux_amd64"
          test "$(dpkg-deb -f "$stem.deb" Package)" = dipper
          test "$(dpkg-deb -f "$stem.deb" Architecture)" = amd64
          depends=$(dpkg-deb -f "$stem.deb" Depends)
          [[ "$depends" == *libgtk-3-0* && "$depends" == *libayatana-appindicator3-1* ]]
          [[ "$depends" != *webkit* ]]
          mkdir -p "$RUNNER_TEMP/deb" "$RUNNER_TEMP/archive"
          dpkg-deb -x "$stem.deb" "$RUNNER_TEMP/deb"
          tar -xzf "$stem.tar.gz" -C "$RUNNER_TEMP/archive"
          test -x "$RUNNER_TEMP/deb/opt/dipper/dipper"
          test -x "$RUNNER_TEMP/archive/dipper"
          test "$(readlink "$RUNNER_TEMP/deb/usr/bin/dipper")" = ../../opt/dipper/dipper
          grep -Fx 'Exec=/opt/dipper/dipper' "$RUNNER_TEMP/deb/usr/share/applications/dipper.desktop"
          cmp "$RUNNER_TEMP/archive/dipper" "$RUNNER_TEMP/deb/opt/dipper/dipper"
      - name: Verify macOS packages
        if: matrix.goos == 'darwin'
        run: |
          stem="dist/dipper_${VERSION}_darwin_${TARGET_ARCH}"
          mkdir -p "$RUNNER_TEMP/archive" "$RUNNER_TEMP/dmg"
          tar -xzf "$stem.tar.gz" -C "$RUNNER_TEMP/archive"
          app="$RUNNER_TEMP/archive/Dipper.app"
          test -x "$app/Contents/MacOS/Dipper"
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          core="${VERSION%%[-+]*}"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$core"
          arch="$TARGET_ARCH"
          if [[ "$arch" == amd64 ]]; then arch=x86_64; fi
          test "$(lipo -archs "$app/Contents/MacOS/Dipper")" = "$arch"
          hdiutil attach "$stem.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/dmg"' EXIT
          test "$(readlink "$RUNNER_TEMP/dmg/Applications")" = /Applications
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Dipper.app"
          cmp "$app/Contents/MacOS/Dipper" "$RUNNER_TEMP/dmg/Dipper.app/Contents/MacOS/Dipper"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          assets=(
            "dipper_${VERSION}_windows_amd64.zip"
            "dipper_${VERSION}_windows_amd64_setup.exe"
            "dipper_${VERSION}_linux_amd64.tar.gz"
            "dipper_${VERSION}_linux_amd64.deb"
            "dipper_${VERSION}_darwin_amd64.tar.gz"
            "dipper_${VERSION}_darwin_amd64.dmg"
            "dipper_${VERSION}_darwin_arm64.tar.gz"
            "dipper_${VERSION}_darwin_arm64.dmg"
          )
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum -- "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "Dipper $RELEASE_TAG" --generate-notes \
            --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
