name: Race Detector
on:
  push:
    branches: [main]
  pull_request:
jobs:
  race:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Chinese fonts for UI rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # The race detector needs cgo, which also exercises the sqlite piece
      # completion that the CGO_ENABLED=0 checks and builds never reach.
      - run: go test -race -count=1 -timeout 10m ./...
